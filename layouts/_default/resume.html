{{ define "main" }}
<article class="page-content resume-page-container">
  <div class="resume-header">
    <h1>{{ .Title }}</h1>
    <a href="/resume.pdf" class="btn btn-primary download-btn" download="Rohit_Saini_Resume.pdf">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Download PDF
    </a>
  </div>

  <div class="resume-viewer-container">
    <iframe src="/resume.pdf#toolbar=0" class="resume-iframe" title="Rohit Saini Resume"></iframe>
    <div class="mobile-fallback">
      <p>Previewing PDFs on mobile devices can be limited.</p>
      <a href="/resume.pdf" class="btn btn-primary" download="Rohit_Saini_Resume.pdf">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Download to View Full Resume
      </a>
    </div>
  </div>
</article>
{{ end }}
